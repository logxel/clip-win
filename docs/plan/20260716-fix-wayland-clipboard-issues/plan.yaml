objective: >
  Fix validated issues in Wayland ext_data_control_v1 clipboard backend
  (wayland_clipboard.rs + clipboard_manager.rs). Working tree already has
  partial fixes for A (UB), E (MIME), F (VecDeque), B (deadline), G (empty),
  H (image decode), I (SAFETY doc). Remaining substantive work: D (image
  clear on selection), B/F generation-counter + per-source HashMap + source
  lifetime tracking, C (wire set_text_robust native→wl-copy→arboard), J
  (comprehensive tests). Multi-seat documented as known limitation.
