# ═══════════════════════════════════════════════════════════════════════════
# PLANNING ANALYSIS (MEDIUM complexity)
# ═══════════════════════════════════════════════════════════════════════════
open_questions:
  - question: "For per-source HashMap (Issue F), is ExtDataControlSourceV1.id() (u32 proxy id) stable across roundtrips for keying?"
    context: >
      Proxy .id() returns the wl_object id which is unique per object lifetime.
      Since each set_text() creates a new proxy via create_data_source, the id
      is unique. The Send handler receives the source proxy as argument — its
      .id() matches the one used at creation time. This is confirmed working
      in the wayland-client pattern.
    type: decision_blocker
    affects: [T3]
  - question: "Does WaylandClipboard need a set_html() method for T4, or can set_text() with text/html offer suffice?"
    context: >
      Current set_text() already offers text/html MIME. For set_html_robust,
      we need to offer text/html as primary. Two options: (a) add a set_html()
      method that offers only text/html, or (b) modify set_text() to accept
      an optional parameter for MIME priority. Prefer (a) for minimal change.
    type: decision_blocker
    affects: [T4]
assumptions:
  - "ExtDataControlSourceV1.id() returns a unique u32 per proxy creation — safe HashMap key"
  - "Generation counter wraps at u64::MAX — impossible in single session"
  - "Old ExtDataControlSourceV1 proxies that are superseded by new set_text calls should be explicitly destroyed to avoid compositor resource leaks"
  - "Multi-seat scenario: currently uses devices.first(). This is acceptable for v1 — document as known limitation"
  - "WaylandClipboard does not implement Clone — set_text_robust takes &mut self so access is fine"

