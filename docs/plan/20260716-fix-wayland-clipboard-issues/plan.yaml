  - id: T3
    title: "Refactor state management — generation counter, per-source HashMap, source lifetime (B/F)"
    description: >
      Upgrade the partial fixes in working tree (owns_selection_deadline,
      pending_set_text VecDeque) to proper robust implementations.
      Three interrelated changes:

      B1 — Generation counter: Replace 'owns_selection: bool' with
      'selection_gen: u64' and per-seat 'expected_gen: HashMap<u32, u64>'.
      Increment selection_gen on each set_text() call. In the Selection
      handler, only suppress re-import if the incoming selection's gen
      matches expected_gen for that seat. This prevents permanent stuck
      detection better than a timeout deadline.
      Remove owns_selection_deadline — superseded by generation counter.
      Reset expected_gen for a seat on:
      - DataOffer event (another app is offering data)
      - Cancelled event (our source was cancelled)
      - Finished event (seat removed — clear all)
      
      B2 — Source lifetime tracking: Add 'active_sources: Vec<ExtDataControlSourceV1>'
      to WaylandState. When set_text() creates a new source, push it onto
      active_sources. After device.set_selection(), destroy all OLD sources
      in active_sources except the newest one. After Cancelled event,
      remove the cancelled source from active_sources.
      This prevents compositor-side resource leaks from orphaned sources.

      F — Per-source pending buffer: Replace 'pending_set_text: VecDeque<String>'
      with 'pending_by_source: HashMap<u32, String>' keyed by source.id().
      In set_text(), store the text keyed by the new source's id.
      In Event::Send handler, look up the text using the received source
      proxy's id(), write it, then remove the entry.
      
      CONTRACT for T4:
      - After T3, WaylandState exposes:
          selection_gen: u64 (current generation)
          expected_gen: HashMap<u32, u64> (per-seat expected generation)
          pending_by_source: HashMap<u32, String> (per-source text)
          active_sources: Vec<ExtDataControlSourceV1>
      - set_text() returns Result<(), WaylandClipboardError> — unchanged
        signature. Internally uses generation counter + HashMap.
      - T4 can call set_text() without worrying about race conditions.
