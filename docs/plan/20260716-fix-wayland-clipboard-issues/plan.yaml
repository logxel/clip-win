  # ────────────────────────────────────────────────────────────────────────
  # WAVE 3: T4 - Wire native Wayland set_text/set_html into fallback chain
  # ────────────────────────────────────────────────────────────────────────
  - id: T4
    title: "Wire WaylandClipboard::set_text() + set_html() into robust fallback chain (C)"
    description: >
      The central integration gap: WaylandClipboard::set_text() exists and
      uses ext_data_control_v1 (zero transient surfaces, no Mutter blinking)
      but is never called from set_text_robust(). Currently set_text_robust
      goes straight to wl-copy.

      Fallback chain for set_text_robust() (Wayland only):
      1. WaylandClipboard::set_text() — native ext_data_control_v1, no
         transient surfaces. If available+Ok → return.
      2. wl-copy external process — existing fallback. If Ok → return.
      3. arboard clipboard set_text — last resort. If Ok → return.
      4. Err("clipboard not available") — unchanged.

      Fallback chain for set_html_robust() (Wayland only):
      1. WaylandClipboard::set_html() — new method on WaylandClipboard
         that offers text/html as primary MIME. If available+Ok → return.
      2. wl-copy with --type text/html — existing fallback. If Ok → return.
      3. arboard clipboard set_html — last resort. If Ok → return.
      4. Err("clipboard not available") — unchanged.

      Implementation pattern (follow existing get_current_text access):
      ```
      #[cfg(target_os = "linux")]
      if crate::session::is_wayland() {
          if let Some(ref mut wayland_clipboard) = self.wayland_clipboard {
              if wayland_clipboard.set_text(text).is_ok() {
                  return Ok(());
              }
              // Fall through to wl-copy
          }
      }
      ```

      Add set_html() method to WaylandClipboard (wayland_clipboard.rs):
      - Same as set_text() but offers text/html as primary MIME
      - Uses the same generation counter + HashMap from T3
      - Returns Result<(), WaylandClipboardError>

      X11 path (xclip) remains unchanged.
      Multi-seat: Document in method doc comment that only the first seat
      (devices[0]) is used. Multi-seat support deferred.

      NOTE: Depends on T3's cleaned-up state management API (generation
      counter, per-source HashMap). T3 must complete first.
